packages:
  - "packages/*"
  - "examples/*"
  - "examples/pi-demo/*"

# Single source of truth for shared versions. Published packages reference these as
# "catalog:"; pnpm rewrites them to the concrete range at pack/publish time, so releases
# MUST go through `pnpm publish` (changeset publish does) — `npm publish` would ship the
# literal "catalog:" specifier.
#
# Ranges are carets because these values become the peerDependency ranges consumers must
# satisfy. The exact versions the workspace builds and tests against live in pnpm-lock.yaml.
catalog:
  effect: ^3.22.0
  "@effect/platform": ^0.97.0
  "@effect/platform-node": ^0.108.0
  "@effect/vitest": ^0.30.0
  # @effect/tsgo's patched tsc bundles the Effect language service; the plugin entry in
  # tsconfig.base.json only supplies its severity config. Do not add
  # @effect/language-service as a separate dependency — it is dead weight.
  "@effect/tsgo": 0.24.2
  "@tanstack/db": ^0.6.16
  "@tanstack/db-sqlite-persistence-core": ^0.2.8
  "@tanstack/react-db": ^0.1.94
  "@tanstack/browser-db-sqlite-persistence": ^0.2.8
  idb: ^8.0.3
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@types/node": ^26.0.0
  typescript: ^7.0.2
  vitest: ^3.2.4
