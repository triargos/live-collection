packages:
  - "packages/*"
  - "examples/*"
  - "examples/pi-demo/*"

# Single source of truth for shared versions. Published packages reference these as
# "catalog:"; pnpm rewrites them to the concrete range at pack/publish time, so releases
# MUST go through `pnpm publish` (changeset publish does) — `npm publish` would ship the
# literal "catalog:" specifier.
#
# Ranges are carets because these values become the peerDependency ranges consumers must
# satisfy. The exact versions the workspace builds and tests against live in pnpm-lock.yaml.
catalog:
  effect: ^4.0.1
  "@effect/platform-node": ^4.0.1
  "@effect/vitest": ^4.0.1
  "@effect/language-service": ^0.87.3
  "@effect/tsgo": 0.48.1
  "@tanstack/db": ^0.12.0
  "@tanstack/db-sqlite-persistence-core": ^0.4.4
  "@tanstack/react-db": ^0.5.4
  "@tanstack/browser-db-sqlite-persistence": ^0.2.29
  idb: ^8.0.3
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.3
  typescript: ^7.0.2
  vitest: ^5.0.2
